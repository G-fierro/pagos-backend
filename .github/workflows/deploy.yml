name: Backend CD

on:
  workflow_run:
    workflows: ["Backend Pipeline"]
    types:
      - completed
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: isoft-ufro/banduairlines-backend

jobs:
  build-and-deploy:
    name: Construir, Publicar y Desplegar
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Autenticar en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_branch }}

      - name: Despliegue VPS y Healthcheck
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/integracion/banduairlines-infra

            # 1. Actualiza y reinicia según la rama
            if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
              SERVICE_NAME="backend-main"
              TARGET_URL="https://isoft.lazycat.app/actuator/health"
            else
              SERVICE_NAME="backend-develop"
              TARGET_URL="https://dev.isoft.lazycat.app/actuator/health"
            fi

            echo "Desplegando servicio $SERVICE_NAME..."
            docker compose pull $SERVICE_NAME
            docker compose up -d $SERVICE_NAME

            # 2. Recargar Caddy para actualizar el mapeo DNS interno hacia la nueva IP del backend
            echo "Recargando configuración de Caddy..."
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile

            # 3. Esperar e iniciar Healthcheck
            echo "Esperando 30 segundos a que la aplicación Spring Boot inicie..."
            sleep 30

            SUCCESS=0
            for i in {1..10}; do
              echo "Intento $i de verificación en $TARGET_URL..."
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $TARGET_URL || echo "000")
              if [ "$HTTP_CODE" -eq 200 ]; then
                echo "Verificación de salud exitosa (Código HTTP 200)"
                SUCCESS=1
                break
              fi
              echo "Respuesta HTTP: $HTTP_CODE. Esperando 5 segundos más..."
              sleep 5
            done

            if [ $SUCCESS -ne 1 ]; then
              echo "Fallo en la verificación de salud tras varios intentos."
              exit 1
            fi