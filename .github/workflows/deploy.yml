name: Backend CD

on:
  workflow_run:
    workflows: ["Backend Pipeline"] 
    types:
      - completed
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: isoft-ufro/banduairlines-backend

jobs:
  build-and-deploy:
    name: Construir, Publicar y Desplegar
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Autenticar en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_branch }}

      - name: Desplegar en VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          script: |
            cd /home/integracion/banduairlines-infra
            
            # Re-autenticar o asegurar la descarga usando credenciales persistentes
            docker compose pull backend-${{ github.event.workflow_run.head_branch }}
            docker compose up -d backend-${{ github.event.workflow_run.head_branch }}

      - name: Despliegue VPS y Healthcheck
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/integracion/banduairlines-infra
            
            # 1. Actualiza y reinicia según la rama
            if [ "${{ github.ref_name }}" = "main" ]; then
              docker compose pull backend-main
              docker compose up -d backend-main
              TARGET_URL="https://isoft.lazycat.app/actuator/health"
            else
              docker compose pull backend-develop
              docker compose up -d backend-develop
              TARGET_URL="https://dev.isoft.lazycat.app/actuator/health"
            fi

            # 2. Espera inicio de Spring Boot (mínimo 25 segundos)
            echo "Esperando 25 segundos a que la aplicación Spring Boot inicie..."
            sleep 25

            # 3. Reintentos de Healthcheck (hasta 5 intentos)
            SUCCESS=0
            for i in {1..5}; do
              echo "Intento $i de verificación en $TARGET_URL..."
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $TARGET_URL || echo "000")
              if [ "$HTTP_CODE" -eq 200 ]; then
                echo "Verificación de salud exitosa (Código HTTP 200)"
                SUCCESS=1
                break
              fi
              echo "Respuesta HTTP: $HTTP_CODE. Esperando 5 segundos más..."
              sleep 5
            done

            if [ $SUCCESS -ne 1 ]; then
              echo "Fallo en la verificación de salud tras varios intentos."
              exit 1
            fi