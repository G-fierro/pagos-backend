name: Tarea / Historia
description: Trabajo planificado de un módulo
labels: ["tipo: tarea"]
body:
  - type: dropdown
    id: modulo
    attributes:
      label: Módulo
      options: [INTEGRA, CUENTA, ADMIN, BÚSQUEDA, RESERVA, PAGOS, CHECKIN, REPORTES, TRACKING]
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Qué se necesita y por qué
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      placeholder: "- [ ] ..."
  - type: textarea
    id: dependencias
    attributes:
      label: Dependencias con otros módulos
