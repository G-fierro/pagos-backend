name: Bug
description: Algo no funciona como se espera
labels: ["tipo: bug"]
body:
  - type: dropdown
    id: modulo
    attributes:
      label: Módulo afectado
      options: [INTEGRA, CUENTA, ADMIN, BÚSQUEDA, RESERVA, PAGOS, CHECKIN, REPORTES, TRACKING]
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado vs. observado
    validations:
      required: true
