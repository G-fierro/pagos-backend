services:
  db:
    image: postgres:16
    container_name: bandu_airlines_db
    environment:
      POSTGRES_DB: ${DB_NAME:-bandu_airlines_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-bandu_airlines_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: